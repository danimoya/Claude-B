name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build only, no publish)'
        required: false
        default: 'true'

permissions:
  contents: write
  packages: write
  id-token: write  # required for npm Trusted Publishing (OIDC)

jobs:
  validate:
    name: Validate exact release source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CB_NATIVE_TMUX: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Verify release package and tag identity
        run: node scripts/check-release-version.mjs
        env:
          CB_RELEASE_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:artifact

  npm:
    name: Publish to npm
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Upgrade npm to a version that supports Trusted Publishing (OIDC).
      # Falls back to NPM_TOKEN if no trusted publisher is configured.
      - name: Upgrade npm CLI
        run: npm install -g npm@12.2.2

      - name: Publish
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            echo "Publishing with NPM_TOKEN"
            npm publish --access public
          else
            echo "Publishing with Trusted Publishing (OIDC)"
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    name: Build & push multi-arch image
    needs: [validate]
    outputs:
      ghcr_image: ${{ steps.names.outputs.ghcr }}
    runs-on: ubuntu-latest
    env:
      # When DOCKERHUB_USERNAME is unset the DockerHub login step is skipped
      # and only GHCR receives the image.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && github.event.inputs.dry_run != 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image names
        id: names
        run: |
          echo "ghcr=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "dockerhub=${DOCKERHUB_USERNAME}/claude-b" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ steps.names.outputs.ghcr }}
            ${{ steps.names.outputs.dockerhub }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event.inputs.dry_run != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [npm, docker]
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ## Install

            ```bash
            # One-line install
            curl -fsSL https://cb.danimoya.com | bash

            # Or via npm
            npm i -g claude-b

            # Or via Docker
            # Use a new state directory and repository owned by this UID.
            docker run -d --user "$(id -u):$(id -g)" \
              --env-file .env \
              --mount type=bind,source=/path/to/private-state,target=/home/node/.claude-b \
              --mount type=bind,source=/path/to/repository,target=/workspace \
              ${{ needs.docker.outputs.ghcr_image }}:${{ github.ref_name }}
            ```
